<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrata Fortuny</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="header__nav">
                <a href="#!" class="header__link">Головна</a>
                <a href="#work-major" class="header__link">Колоди</a>
                <a href="#contact-1" class="header__link">Зв'язатися</a>
            </nav>
            <button class="burger-menu" type="button">
                <img src="Images/burger.svg" alt="" class="burger-menu__icon">
            </button>
        </div>
    </header>
    <section class="main-section">
        <img src="Images/gadalka.png" class="gadalka__img" alt="">
    
        <div class="stars-layer" id="starsLayer"></div>
        <img src="Images/bottom-slider.png" class="bottom-brush" alt="">
        <div class="main-section__content">
            <p>Передбачь майбутнє</p>
            <h1>Зазирни в карти — знайди свій шлях</h1>
            <a href="#">Дізнатися більше</a>
        </div>
    </section>

    <section>
        <img src="Images/Main.png" class="main__img" alt="">
    </section>
    <section class="hero-card">
        <div class="hero-card__content">
    
            <div class="cards-viewport" id="cardsSlider">
                <div class="cards-track" id="cardsTrack">
                    <div class="card-slide">
                        <div class="card-placeholder">1</div>
                    </div>
            
                    <div class="card-slide">
                        <div class="card-placeholder">2</div>
                    </div>
            
                    <div class="card-slide">
                        <div class="card-placeholder">3</div>
                    </div>
            
                    <div class="card-slide">
                        <div class="card-placeholder">4</div>
                    </div>
            
                    <div class="card-slide">
                        <div class="card-placeholder">5</div>
                    </div>
            
                    <div class="card-slide">
                        <div class="card-placeholder">6</div>
                    </div>
            
                    <div class="card-slide">
                        <div class="card-placeholder">7</div>
                    </div>

                    <div class="card-slide">
                        <div class="card-placeholder">3</div>
                    </div>
                    
                    <div class="card-slide">
                        <div class="card-placeholder">4</div>
                    </div>
                    
                    <div class="card-slide">
                        <div class="card-placeholder">5</div>
                    </div>
                    
                    <div class="card-slide">
                        <div class="card-placeholder">6</div>
                    </div>
                    
                    <div class="card-slide">
                        <div class="card-placeholder">7</div>
                    </div>
                </div>
            </div>
            
            <div class="slider-dots" id="sliderDots"></div>
    
        </div>
    </section>
    <div class="custom-cursor">
        <span class="custom-cursor__dot"></span>
    </div>
    <script src="script.js"></script>
</body>
</html>
