<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3A1B6D"/>
            <stop offset="55%" stop-color="#101636"/>
            <stop offset="100%" stop-color="#050711"/>
        </radialGradient>

        <linearGradient id="gold" x1="120" y1="80" x2="390" y2="430">
            <stop offset="0%" stop-color="#FFE08A"/>
            <stop offset="35%" stop-color="#F6A21A"/>
            <stop offset="70%" stop-color="#C96A08"/>
            <stop offset="100%" stop-color="#FFD36A"/>
        </linearGradient>

        <linearGradient id="bluePurple" x1="120" y1="130" x2="390" y2="390">
            <stop offset="0%" stop-color="#00B7FF"/>
            <stop offset="45%" stop-color="#3528A8"/>
            <stop offset="100%" stop-color="#A733D6"/>
        </linearGradient>

        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <g transform="translate(256 256)">
        <!-- outer glow -->
        <circle r="190" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="18" filter="url(#softGlow)"/>

        <!-- outer rings -->
        <circle r="184" stroke="url(#gold)" stroke-width="8"/>
        <circle r="164" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
        <circle r="132" stroke="url(#gold)" stroke-width="5"/>

        <!-- zodiac colored ring -->
        <circle r="148" fill="none" stroke="url(#bluePurple)" stroke-width="28" opacity="0.9"/>

        <!-- radial spokes -->
        <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
            <line x1="0" y1="-132" x2="0" y2="-178"/>
            <line x1="66" y1="-114" x2="90" y2="-156"/>
            <line x1="114" y1="-66" x2="156" y2="-90"/>
            <line x1="132" y1="0" x2="178" y2="0"/>
            <line x1="114" y1="66" x2="156" y2="90"/>
            <line x1="66" y1="114" x2="90" y2="156"/>
            <line x1="0" y1="132" x2="0" y2="178"/>
            <line x1="-66" y1="114" x2="-90" y2="156"/>
            <line x1="-114" y1="66" x2="-156" y2="90"/>
            <line x1="-132" y1="0" x2="-178" y2="0"/>
            <line x1="-114" y1="-66" x2="-156" y2="-90"/>
            <line x1="-66" y1="-114" x2="-90" y2="-156"/>
        </g>

        <!-- small golden dots -->
        <g fill="#F7B733">
            <circle cx="0" cy="-164" r="6"/>
            <circle cx="82" cy="-142" r="6"/>
            <circle cx="142" cy="-82" r="6"/>
            <circle cx="164" cy="0" r="6"/>
            <circle cx="142" cy="82" r="6"/>
            <circle cx="82" cy="142" r="6"/>
            <circle cx="0" cy="164" r="6"/>
            <circle cx="-82" cy="142" r="6"/>
            <circle cx="-142" cy="82" r="6"/>
            <circle cx="-164" cy="0" r="6"/>
            <circle cx="-142" cy="-82" r="6"/>
            <circle cx="-82" cy="-142" r="6"/>
        </g>

        <!-- simple zodiac-like marks -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
            <path d="M-53 -112 C-42 -126 -31 -126 -20 -112 C-9 -126 2 -126 13 -112" stroke="#43D9FF"/>
            <path d="M58 -116 C45 -104 45 -88 58 -78 C71 -88 71 -104 58 -116Z" stroke="#D166FF"/>
            <path d="M112 -50 C130 -62 138 -42 124 -30 C111 -18 92 -27 98 -45" stroke="#43D9FF"/>
            <path d="M110 54 C125 40 138 60 121 76 C107 89 88 73 99 58" stroke="#D166FF"/>
            <path d="M46 112 L66 88 M46 88 L66 112" stroke="#43D9FF"/>
            <path d="M-58 104 C-43 119 -25 104 -39 88 C-52 73 -72 86 -58 104Z" stroke="#D166FF"/>
            <path d="M-118 34 C-98 14 -78 34 -98 54 C-112 68 -132 50 -118 34Z" stroke="#43D9FF"/>
            <path d="M-116 -48 C-102 -66 -82 -52 -94 -34 C-108 -14 -130 -28 -116 -48Z" stroke="#D166FF"/>
        </g>

        <!-- compass star -->
        <g filter="url(#softGlow)">
            <path d="M0 -112 L18 -32 L0 -44 L-18 -32 Z" fill="url(#gold)"/>
            <path d="M112 0 L32 18 L44 0 L32 -18 Z" fill="url(#gold)"/>
            <path d="M0 112 L-18 32 L0 44 L18 32 Z" fill="url(#gold)"/>
            <path d="M-112 0 L-32 -18 L-44 0 L-32 18 Z" fill="url(#gold)"/>

            <path d="M78 -78 L24 -24 L30 -42 L42 -30 Z" fill="#F8B133"/>
            <path d="M78 78 L42 30 L30 42 L24 24 Z" fill="#F8B133"/>
            <path d="M-78 78 L-24 24 L-30 42 L-42 30 Z" fill="#F8B133"/>
            <path d="M-78 -78 L-42 -30 L-30 -42 L-24 -24 Z" fill="#F8B133"/>
        </g>

        <!-- center medallion -->
        <circle r="54" fill="#101636" stroke="url(#gold)" stroke-width="8"/>
        <circle r="34" fill="url(#gold)"/>
        <path d="M0 -20 C18 -10 20 8 6 18 C-8 29 -28 18 -24 0 C-18 10 -6 8 0 0 C7 -9 3 -17 0 -20Z" fill="#7A3100" opacity="0.75"/>
        <circle r="10" fill="#FFF1A6"/>

        <!-- top jewel -->
        <g transform="translate(0 -210)">
            <path d="M0 -28 L24 8 L0 42 L-24 8 Z" fill="url(#gold)"/>
            <path d="M0 -10 L12 8 L0 26 L-12 8 Z" fill="#B64CFF"/>
            <path d="M0 -10 L12 8 L0 2 L-12 8 Z" fill="#F2A7FF"/>
        </g>

        <!-- bottom jewel -->
        <g transform="translate(0 210)">
            <path d="M0 28 L24 -8 L0 -42 L-24 -8 Z" fill="url(#gold)"/>
            <path d="M0 10 L12 -8 L0 -26 L-12 -8 Z" fill="#22B9FF"/>
            <path d="M0 10 L12 -8 L0 -2 L-12 -8 Z" fill="#A8F1FF"/>
        </g>

        <!-- side ornaments -->
        <g>
            <path d="M-214 0 L-184 -22 L-154 0 L-184 22 Z" fill="url(#gold)"/>
            <circle cx="-184" cy="0" r="11" fill="#22B9FF"/>
            <path d="M214 0 L184 -22 L154 0 L184 22 Z" fill="url(#gold)"/>
            <circle cx="184" cy="0" r="11" fill="#FF5A2E"/>
        </g>
    </g>
</svg>